<title>ELFIN Consulting – Geschützter Bereich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#EA8635;--orange-lt:#FCA957;--navy:#052535;--navy-2:#0B3950;
    --grad:linear-gradient(135deg,#EA8635 0%,#FCA957 100%);
    --font:'Montserrat',Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font);background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;position:relative;overflow:hidden;
  }
  body::before{
    content:'';position:absolute;top:-25%;right:-10%;width:780px;height:780px;
    background:radial-gradient(circle at 50% 50%,var(--navy-2) 0%,var(--navy-2) 60%,transparent 61%);opacity:.9;
  }
  body::after{
    content:'';position:absolute;bottom:-160px;left:6%;width:340px;height:340px;
    background:var(--grad);border-radius:0 200px 0 200px;opacity:.12;transform:rotate(12deg);
  }
  .card{
    position:relative;z-index:2;width:100%;max-width:420px;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
    border-radius:0 40px 0 40px;padding:40px 36px;backdrop-filter:blur(6px);text-align:center;
  }
  .mark{
    width:54px;height:54px;border-radius:0 18px 0 18px;background:var(--grad);
    margin:0 auto 22px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(234,134,53,.32);
  }
  .mark svg{width:26px;height:26px;fill:#fff;}
  .brand{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--orange-lt);margin-bottom:8px;}
  h1{font-size:21px;font-weight:600;color:#fff;line-height:1.3;margin-bottom:8px;}
  p.sub{font-size:13.5px;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:26px;}
  form{display:flex;flex-direction:column;gap:14px;}
  input[type=password]{
    font-family:var(--font);font-size:15px;padding:13px 16px;border-radius:10px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;
    width:100%;outline:none;transition:border-color .2s;
  }
  input[type=password]:focus{border-color:var(--orange);}
  input::placeholder{color:rgba(255,255,255,.4);}
  button{
    font-family:var(--font);font-size:14px;font-weight:600;letter-spacing:.3px;
    padding:13px 16px;border:none;border-radius:100px;cursor:pointer;
    background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(234,134,53,.3);transition:transform .2s,box-shadow .2s;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(234,134,53,.42);}
  button:disabled{opacity:.6;cursor:wait;transform:none;}
  .err{font-size:12.5px;color:#FFB4A8;min-height:16px;margin-top:2px;}
  .foot{margin-top:24px;font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.3px;}
</style>
</head>

      <div class="err" id="err"></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256" },
    baseKey, { name:"AES-GCM", length:256 }, false, ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(ENC.iv) }, key, b64(ENC.ct));
  return new TextDecoder().decode(plain);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  const pw = document.getElementById("pw").value;
  err.textContent = ""; btn.disabled = true; btn.textContent = "Entschlüssele…";
  try {
    const html = await decrypt(pw);
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = "Falsches Passwort. Bitte erneut versuchen.";
    btn.disabled = false; btn.textContent = "Öffnen";
    document.getElementById("pw").value = "";
    document.getElementById("pw").focus();
  }
});
</script>
